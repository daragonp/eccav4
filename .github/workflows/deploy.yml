#!/usr/bin/env bash
set -e

APP_DIR="/srv/laravel"
COMPOSE="docker compose"
SERVICE="app"   # <-- cambia esto si tu servicio tiene otro nombre

cd "$APP_DIR"

echo "==> Actualizando código"
git fetch origin master
git reset --hard origin/master

echo "==> Instalando dependencias PHP"
$COMPOSE exec -T $SERVICE composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

echo "==> Instalando dependencias Node"
$COMPOSE exec -T $SERVICE npm ci

echo "==> Compilando assets"
$COMPOSE exec -T $SERVICE npm run build

echo "==> Limpiando y cacheando"
$COMPOSE exec -T $SERVICE php artisan optimize:clear
$COMPOSE exec -T $SERVICE php artisan config:cache
$COMPOSE exec -T $SERVICE php artisan route:cache
$COMPOSE exec -T $SERVICE php artisan view:cache

echo "==> Migrando base de datos"
$COMPOSE exec -T $SERVICE php artisan migrate --force

echo "==> Ajustando permisos"
chown -R www-data:www-data storage bootstrap/cache || true
chmod -R 775 storage bootstrap/cache || true

echo "==> Deploy completado"
